name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to full 40-hex SHAs (CWE-829): this
      # workflow holds contents: write and the updater signing key, so a
      # hijacked mutable tag must not reach it. To update a pin, resolve the
      # new tag's commit: gh api repos/<owner>/<repo>/git/ref/tags/<tag>
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Fail fast on a mis-versioned tag: the tag must match the single
      # source of truth in src-tauri/Cargo.toml.
      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != Cargo.toml v$v" }

      # tauri-action runs beforeBuildCommand (npm run build) + tauri build,
      # creates the GitHub release (tagName + releaseName are REQUIRED —
      # without them it only builds and uploads nothing), uploads the NSIS
      # setup exe, and — with the signing env vars present and
      # createUpdaterArtifacts on — also signs and uploads the updater
      # artifacts including latest.json.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mnemark v__VERSION__"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The portable build is the same raw exe the NSIS bundle was made from.
      # Asset name convention: the About-page updater matches /portable/i + .exe.
      - name: Stage portable exe
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/mnemark.exe" "Mnemark_${{ github.ref_name }}_x64-portable.exe"

      # Portable downloads verify this minisign signature (same key as the
      # NSIS updater artifacts) before the new exe is written to disk.
      - name: Sign portable exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign "Mnemark_${{ github.ref_name }}_x64-portable.exe"

      - name: Upload portable asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "Mnemark_${{ github.ref_name }}_x64-portable.exe" "Mnemark_${{ github.ref_name }}_x64-portable.exe.sig" --clobber

      # tauri-action creates the release with the commit message as body.
      # Replace it with this version's CHANGELOG section (header line dropped —
      # the release page already shows version and date).
      # Notes go INLINE, never --notes-file: gh's file read on Windows runners
      # mangled a non-ASCII char into U+FFFD in the v0.4.4 notes even though
      # the pwsh-written file was valid UTF-8. The UTF-16 command line
      # preserves Unicode end to end.
      - name: Set release notes from CHANGELOG
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $changelog = [System.IO.File]::ReadAllText("CHANGELOG.md", [System.Text.UTF8Encoding]::new($false))
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($ver))\].*?(?=^## \[|^\[\d|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $ver" }
          $notes = (($m.Value.Trim() -split "`r?`n") | Select-Object -Skip 1) -join "`n"
          gh release edit "${{ github.ref_name }}" --notes=$notes
