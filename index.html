<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemark Panel</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="workspace" data-mode="center">
      <aside id="workspace-drawer" class="workspace-pane workspace-drawer hidden" aria-label="抽屜">
        <div id="favorites-panel">
          <header class="favorites-header">
            <h1 data-i18n="favorites">抽屜</h1>
            <button id="favorites-add" class="favorites-add-btn" data-i18n-title="favoritesAdd" data-i18n-aria-label="favoritesAdd">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </header>
          <div id="favorites-create-row" class="favorites-create-row hidden">
            <div id="favorites-create-input" class="favorites-create-input" role="textbox" contenteditable="plaintext-only" spellcheck="false" data-i18n-aria-label="collectionNamePlaceholder" aria-label="抽屜名稱"></div>
          </div>
          <div id="favorites-list"></div>
          <div id="favorites-empty" class="favorites-empty hidden">
            <p data-i18n="noCollections">尚無抽屜</p>
            <span data-i18n="noCollectionsHint">點擊右上角「新增」建立第一個抽屜</span>
          </div>
          <div id="favorites-toast" class="toast hidden"></div>
          <div id="favorites-more-menu" class="clip-action-menu hidden" role="menu"></div>
        </div>
      </aside>

      <div id="panel">
      <div class="search-container">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="搜尋剪貼簿歷史…" data-i18n-placeholder="searchPlaceholder" spellcheck="false" aria-describedby="search-shortcut-hint" />
        <kbd class="search-keycap" aria-hidden="true">/</kbd>
        <span id="search-shortcut-hint" class="sr-only" data-i18n="searchShortcutHint">按 / 聚焦搜尋</span>
        <button id="selection-toggle" class="panel-icon-btn" data-i18n-aria-label="selectionEnter" title="選取">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 12 3 3 5-6"/></svg>
        </button>
        <button id="favorites-toggle" class="favorites-toggle" aria-pressed="false" data-i18n-aria-label="sidebarOpen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
      </div>
      <div id="filter-bar" role="group" aria-label="Filter by type">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span data-i18n="filterAll">全部</span>
        </button>
        <button class="filter-btn" data-filter="text" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span data-i18n="filterText">文字</span>
        </button>
        <button class="filter-btn" data-filter="image" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span data-i18n="filterImage">圖片</span>
        </button>
        <button class="filter-btn" data-filter="files" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span data-i18n="filterFiles">檔案</span>
        </button>
        <button class="filter-btn" data-filter="links" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span data-i18n="filterLinks">連結</span>
        </button>
      </div>
      <div id="selection-toolbar" class="selection-toolbar hidden" role="toolbar" aria-label="批次操作">
        <button id="selection-all" class="selection-toolbar-btn" data-i18n="selectAllVisible">全選</button>
        <span id="selection-count" class="selection-count" aria-live="polite"></span>
        <button id="selection-add" class="selection-toolbar-btn selection-toolbar-primary" data-i18n="addToCollection">加入抽屜</button>
        <button id="selection-destructive" class="selection-toolbar-btn selection-toolbar-danger"></button>
        <button id="selection-cancel" class="selection-toolbar-btn" data-i18n="cancel">取消</button>
      </div>
      <div id="clip-list"></div>
      <div id="empty-state" class="hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <p id="empty-title" data-i18n="emptyTitle">尚無剪貼簿歷史</p>
        <span id="empty-hint" data-i18n="emptyHint">複製一些內容就會出現在這裡</span>
      </div>
      <div id="toast" class="toast hidden"></div>
      <div id="clip-action-menu" class="clip-action-menu hidden" role="menu"></div>
      <div id="add-to-collection-menu" class="clip-action-menu hidden" role="menu"></div>
      </div>

      <aside id="workspace-preview" class="workspace-pane workspace-preview hidden" aria-label="預覽">
        <div id="preview-panel">
          <header class="preview-header"><span class="preview-kind" id="preview-kind">文字</span></header>
          <div class="preview-warning hidden" id="preview-warning" role="alert"></div>
          <div class="preview-content" id="preview-content"></div>
          <section class="preview-note hidden" id="preview-note" aria-labelledby="preview-note-label">
            <div class="preview-note-label" id="preview-note-label" data-i18n="previewNote">備註</div>
            <div class="preview-note-text" id="preview-note-text"></div>
          </section>
          <footer class="preview-meta">
            <div class="preview-meta-row"><span class="preview-meta-label" data-i18n="previewSource">來源</span><span class="preview-meta-value" id="preview-source"></span></div>
            <div class="preview-meta-row"><span class="preview-meta-label" data-i18n="previewCaptured">擷取時間</span><span class="preview-meta-value" id="preview-captured"></span></div>
            <div class="preview-meta-row"><span class="preview-meta-label" data-i18n="previewSize">大小</span><span class="preview-meta-value" id="preview-size"></span></div>
          </footer>
        </div>
      </aside>

      <div id="note-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
        <div class="modal-panel note-modal-panel" role="document">
          <h2 id="note-modal-title" data-i18n="noteDialogTitle">編輯備註</h2>
          <textarea id="note-input" class="note-input" data-i18n-placeholder="notePlaceholder" placeholder="輸入備註…" spellcheck="true"></textarea>
          <p class="note-hint" data-i18n="noteHint">留空並儲存即可移除備註</p>
          <div class="modal-actions">
            <button type="button" id="note-cancel" class="btn-cancel" data-i18n="cancel">取消</button>
            <button type="button" id="note-save" class="btn-primary" data-i18n="save">儲存</button>
          </div>
        </div>
      </div>

      <div id="workspace-tabs" class="workspace-tabs hidden" role="tablist" aria-label="側欄">
        <button id="workspace-tab-drawer" role="tab" data-i18n="favorites">抽屜</button>
        <button id="workspace-tab-preview" role="tab" data-i18n="previewTab">預覽</button>
      </div>

      <div id="drag-overlay-card" class="item-drag-preview hidden workspace-drag-card" aria-hidden="true"></div>

      <div id="remove-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="remove-modal-title">
        <div class="modal-panel" role="document">
          <h2 id="remove-modal-title" data-i18n="removeCollectionTitle">刪除抽屜</h2>
          <p id="remove-modal-body" class="modal-body"></p>
          <div class="modal-actions">
            <button type="button" id="remove-modal-cancel" class="btn-cancel" data-i18n="cancel">取消</button>
            <button type="button" id="remove-modal-confirm" class="btn-primary btn-danger" data-i18n="removeCollectionConfirm">刪除</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts" defer></script>
  </body>
</html>
